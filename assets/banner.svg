<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Eirik Kaleid — Backend &amp; Systems Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B10"/>
      <stop offset="0.55" stop-color="#0B1A1F"/>
      <stop offset="1" stop-color="#0E3B3C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2EC4B6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="360" fill="url(#fade)"/></mask>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2EC4B6"/>
      <stop offset="1" stop-color="#7FE7DC"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- system diagram: shop floor -> services -> database -->
  <g fill="none" stroke="#2EC4B6" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
    <path d="M808 112H880V180H952" stroke-opacity="0.55"/>
    <path d="M808 248H880V180" stroke-opacity="0.55"/>
    <path d="M1032 180H1096" stroke-opacity="0.55"/>
    <path d="M1032 180H1064V96H1096" stroke-opacity="0.35"/>
    <path d="M1032 180H1064V264H1096" stroke-opacity="0.35"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9FE9E1" text-anchor="middle">
    <rect x="712" y="92" width="96" height="40" rx="8" fill="#0D2A2C" stroke="#2EC4B6" stroke-opacity="0.6"/>
    <text x="760" y="116">PLC / MES</text>
    <rect x="712" y="228" width="96" height="40" rx="8" fill="#0D2A2C" stroke="#2EC4B6" stroke-opacity="0.6"/>
    <text x="760" y="252">ERP</text>
    <rect x="952" y="152" width="80" height="56" rx="10" fill="#10393A" stroke="#2EC4B6"/>
    <text x="992" y="177" fill="#E6FFFB" font-weight="600">API</text>
    <text x="992" y="195" font-size="10" fill="#7FE7DC">services</text>
    <rect x="1096" y="76" width="112" height="40" rx="8" fill="#0D2A2C" stroke="#2EC4B6" stroke-opacity="0.6"/>
    <text x="1152" y="100">dashboards</text>
    <rect x="1096" y="160" width="112" height="40" rx="8" fill="#0D2A2C" stroke="#2EC4B6" stroke-opacity="0.6"/>
    <text x="1152" y="184">SQL · reports</text>
    <rect x="1096" y="244" width="112" height="40" rx="8" fill="#0D2A2C" stroke="#2EC4B6" stroke-opacity="0.6"/>
    <text x="1152" y="268">automation</text>
  </g>
  <g fill="#2EC4B6">
    <circle cx="880" cy="180" r="4"/>
    <circle cx="1064" cy="180" r="4"/>
  </g>

  <!-- text block -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="80" y="112" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="3" fill="#2EC4B6">$ whoami</text>
    <text x="78" y="184" font-size="68" font-weight="700" fill="#E6EDF3" letter-spacing="-1">Eirik Kaleid</text>
    <rect x="80" y="206" width="72" height="4" rx="2" fill="url(#accent)"/>
    <text x="80" y="250" font-size="24" font-weight="500" fill="#C9D6DF">Backend &amp; Systems Developer</text>
    <text x="80" y="284" font-size="16" fill="#7D8F9C">Industrial automation · ERP/MES integrations · Data &amp; reporting</text>
  </g>
</svg>
